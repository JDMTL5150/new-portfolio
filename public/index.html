<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jacob Dawes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="particle-canvas"></canvas>

<header>
  <div class="wrap">
    <nav aria-label="Main">
      <a class="logo" href="#top"><i></i><span id="logo"></span></a>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#contact">Contact</a></li>
        <li>
          <label class="theme-switch">
            <span>
              <img src="Assets/images/Moon.png" alt="🌙" style="width: 2rem; height: 2rem;">
            </span>
            <input 
              id="theme-slider"
              type="range" 
              name="step-slider" 
              min="0" 
              max="100" 
              step="100" 
              value="0"
            >
            <span>
              <img src="Assets/images/Sun.png" alt="☀️" style="width: 2rem; height: 2rem;">
            </span>
          </label>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="status"><i></i><span id="status"></span></div>
      <h1 id="headline"></h1>
      <p class="lede oversized" id="lede"></p>
      <div class="btns">
        <a class="btn primary" href="#work">See my work</a>
        <a class="btn" id="heroEmail" href="#contact">Get in touch</a>
      </div>
    </div>
  </section>

  <section id="about">
    <div class="wrap about">
      <div class="portrait" id="portrait"></div>
      <div>
        <h2>About me</h2>
        <div id="bio"></div>
        <div class="facts" id="facts"></div>
      </div>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <h2>Selected work</h2>
      <div class="grid" id="projects"></div>
    </div>
  </section>

  <section id="skills">
    <div class="wrap">
      <h2>What I work with</h2>
      <div class="skills" id="skillList"></div>
    </div>
  </section>

  <section id="experience">
    <div class="wrap">
      <h2>Experience</h2>
      <ul class="timeline" id="jobs"></ul>
    </div>
  </section>

  <section id="education">
    <div class="wrap">
      <h2>Education</h2>
      <ul class="timeline" id="schools"></ul>
    </div>
  </section>

  <section id="languages">
    <div class="wrap">
      <h2>Spoken Languages</h2>
      <ul class="skill-grid" id="lang-list"></ul>
    </div>
  </section>

  <section id="certifications">
    <div class="wrap">
      <h2>Certifications</h2>
      <ul class="skill-grid" id="cert-list"></ul>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="wrap">
      <h2 id="contactTitle"></h2>
      <p id="contactText" style="color:var(--muted)"></p>
      <a class="btn primary" id="mailBtn" href="#">Send an email</a>
      <div class="links" id="socials"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap" id="footer"></div>
</footer>

<script src="js/script.js"></script>
<script src="js/particles.js"></script>
</body>
</html>
